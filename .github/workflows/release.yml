name: Release companion
concurrency:
  group: companion-release
  cancel-in-progress: false
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rpm_only:
        description: Add only an RPM to the current version (verify and merge updater manifest afterwards)
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked -p gabbaproc-core
        working-directory: desktop
  release:
    needs: validate
    strategy:
      fail-fast: false
      # The action merges one shared latest.json; concurrent uploads can lose entries.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(inputs.rpm_only && '[{"os":"ubuntu-22.04","args":"--bundles rpm"}]' || '[{"os":"ubuntu-22.04","args":"--bundles deb,rpm,appimage"},{"os":"windows-latest","args":"--bundles nsis"},{"os":"macos-15","args":"--target aarch64-apple-darwin --bundles dmg,app"},{"os":"macos-15-intel","args":"--target x86_64-apple-darwin --bundles dmg,app"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop
      - run: npm ci
        working-directory: desktop
      - name: Load release notes for the app updater
        id: release_notes
        shell: python
        run: |
          import os, pathlib, uuid
          notes = pathlib.Path("desktop/RELEASE-NOTES.md").read_text(encoding="utf-8")
          delimiter = "notes_" + uuid.uuid4().hex
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("body<<" + delimiter + "\n" + notes + "\n" + delimiter + "\n")
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: GabbaProc Companion v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: ${{ !inputs.rpm_only }}
          prerelease: false
          includeUpdaterJson: ${{ !inputs.rpm_only }}
          args: ${{ matrix.args }}
